.meta{position:absolute;top:13px;left:16px;font-size:10px;color:#3f3f3f;font-variant-numeric:tabular-nums}

.row .chip{flex:1;text-align:center}
.vlist{max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}

  .vertag{margin-top:16px;font-size:.68rem;color:#6d7686;letter-spacing:.04em;text-align:center;}

<body>
<div class="wrap">
<h1>Repeat Drill</h1>
<p class="sub" id="sub">Part B 復唱ドリル</p>
<div class="bar">
  <button class="chip" data-t="0">全部</button>
  <button class="chip" data-t="1">短文 5-8語</button>
  <button class="chip" data-t="2">中文 9-12語</button>
  <button class="chip" data-t="3">長文 13語+</button>
  <button class="chip" id="gear">⚙</button>
</div>
<div class="bar" style="margin-top:-6px">
  <button class="chip" data-r="d">日常・職場</button>
  <button class="chip" data-r="n">ニュース</button>
  <button class="chip" data-r="a">両方</button>
</div>
<div class="setpanel" id="setpanel">
  <div class="setlabel">再生速度</div>
  <div class="row" id="speeds"></div>
  <div class="setlabel">声</div>
  <div class="vlist" id="voices"></div>
</div>
<div class="stage" id="stage"></div>
<div class="ctrl">
  <button class="sbtn" id="skip">スキップ</button>
  <button class="sbtn" id="reset">記録リセット</button>
  <button class="sbtn" onclick="micCheck()">マイク診断</button>
  <button class="sbtn" id="autorecBtn" onclick="toggleAutoRec()">自動録音: ON</button>
</div>
<div class="stats">
  <div class="stat"><b id="st1">0</b><span>本日</span></div>
  <div class="stat"><b id="st2">0</b><span>正答率</span></div>
  <div class="stat"><b id="st3">0</b><span>要再挑戦</span></div>
</div>
<p class="foot">音声は1回のみ再生 ・ 言い直しなし<br>本番は6秒以内に開始、15秒以内に解答</p>
</div>

const SPEEDS=[{l:"0.9x",r:0.9},{l:"1.0x",r:1.0},{l:"1.1x",r:1.1}];
const LS={sched:"rd_sched",streak:"rd_streak",seen:"rd_seen",day:"rd_day",
 cnt:"rd_cnt",ok:"rd_ok",sp:"rd_sp",vo:"rd_vo",reg:"rd_reg"};

const GAP_FAIL=5;    // 誤答は最低5問あけて再出題
const GAP_RETRY=20;  // 1回正解しても20問後にもう一度確認
const CLEAR_AT=2;    // 連続2回正解で卒業
const NO_REPEAT=12;  // 直近12問は引かない

let tier=0, cur=null, phase="ready", played=false, timer=null, left=15;
let voices=[], spIdx=+(localStorage.getItem(LS.sp)??1), voIdx=+(localStorage.getItem(LS.vo)??0);
let reg=localStorage.getItem(LS.reg)||"d";
let sched=JSON.parse(localStorage.getItem(LS.sched)||"{}");   // 文 -> 再出題可能になる通算問番号
let streak=JSON.parse(localStorage.getItem(LS.streak)||"{}"); // 文 -> 連続正解数
let seen=new Set(JSON.parse(localStorage.getItem(LS.seen)||"[]"));
let history=[];  // 直近に出した文（セッション内のみ）
let total=+(localStorage.getItem("rd_total")||0); // 通算問番号

function jstDay(){const d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10);}
const today=jstDay();
if(localStorage.getItem(LS.day)!==today){localStorage.setItem(LS.day,today);
 localStorage.setItem(LS.cnt,"0");localStorage.setItem(LS.ok,"0");}
let cnt=+(localStorage.getItem(LS.cnt)||0), okCnt=+(localStorage.getItem(LS.ok)||0);

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(LS.sched,JSON.stringify(sched));
 localStorage.setItem(LS.streak,JSON.stringify(streak));
 localStorage.setItem(LS.seen,JSON.stringify([...seen]));
 localStorage.setItem(LS.cnt,cnt);localStorage.setItem(LS.ok,okCnt);
 localStorage.setItem("rd_total",total);}

function loadVoices(){const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith("en"));
 if(v.length){voices=v;if(voIdx>=v.length)voIdx=0;renderSet();}}
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;

let warmed=false, speakToken=0;
// 第2引数は「読み終わったあとにやること」。iOSでは読み上げ中にマイクを掴むと
// 音声の出力先が録音側に切り替わって読み上げが途切れるため、終わるまで待つ。
function speak(t,cb){speechSynthesis.cancel();
 if(!warmed){const w=new SpeechSynthesisUtterance(" ");w.volume=0;speechSynthesis.speak(w);warmed=true;}
 const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=SPEEDS[spIdx].r;
 if(voices[voIdx])u.voice=voices[voIdx];
 const my=++speakToken; let fired=false;
 const finish=()=>{ if(fired||my!==speakToken)return; fired=true; clearTimeout(wd); if(cb)cb(); };
 // onend が届かない端末があるので、語数から見積もった保険も置く
 const words=(t.match(/\S+/g)||[]).length;
 const wd=setTimeout(finish, words/2.6/(SPEEDS[spIdx].r||1)*1000 + 2000);
 u.onend=finish; u.onerror=finish;
 speechSynthesis.speak(u);}

function pool(){return S.filter(s=>(tier===0||s.t===tier)&&(reg==="a"||s.r===reg));}

function pick(){
 const p=pool(); if(!p.length)return null;
 // 直近履歴は除外。ただしプールが小さいときは除外幅を縮める
 const hn=Math.max(0,Math.min(NO_REPEAT,p.length-2));
 const recent=new Set(history.slice(-hn));
 let avail=p.filter(s=>!recent.has(s.e));
 if(!avail.length)avail=p;
 // 1. 再出題の期限が来た誤答
 const due=avail.filter(s=>sched[s.e]!==undefined&&sched[s.e]<=total);
 if(due.length)return due[Math.random()*due.length|0];
 // 2. 未出題
 const fresh=avail.filter(s=>!seen.has(s.e)&&sched[s.e]===undefined);
 if(fresh.length)return fresh[Math.random()*fresh.length|0];
 // 3. 卒業済みから復習
 const rest=avail.filter(s=>sched[s.e]===undefined);
 return (rest.length?rest:avail)[Math.random()*(rest.length?rest.length:avail.length)|0];
}

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(){left=15;stopTimer();
 timer=setInterval(()=>{left--;const el=$("tm"),lb=$("tl");
  if(el){el.textContent=left;el.style.color=left<=5?"#e07a7a":left<=9?"#c9a227":"#e6e6e6";}
  if(lb)lb.textContent=left<=9?"秒 ・ 本番ならもう話し始めている":"秒";
  if(left<=0){stopTimer();phase="reveal";render();}},1000);}


/* ================= 録音・聴き比べ ================= */
/* 音声は IndexedDB に保存する。localStorage はテキスト専用で容量が足りないため。 */
const REC_KEEP = 60;                       // 直近60件だけ残す
let autoRec = (localStorage.getItem('rd_autorec')||'1')==='1';
let mediaRec=null, recChunks=[], recStream=null, recTimer=null;
let recState='idle';                       // idle | rec | has
let curBlobURL=null, curKey=null;

let RDB=null;
function idb(){
  return new Promise((res,rej)=>{
    if(RDB) return res(RDB);
    const q=indexedDB.open('rd_audio',1);
    q.onupgradeneeded=()=>{ const db=q.result;
      if(!db.objectStoreNames.contains('clips')) db.createObjectStore('clips',{keyPath:'k'}); };
    q.onsuccess=()=>{ RDB=q.result; res(RDB); };
    q.onerror=()=>rej(q.error);
  });
}
async function idbPut(k,blob,text){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('clips','readwrite');
    tx.objectStore('clips').put({k,blob,text,at:Date.now()});
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(k){
  const db=await idb();
  return new Promise((res)=>{
    const tx=db.transaction('clips','readonly');
    const r=tx.objectStore('clips').get(k);
    r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);
  });
}
async function idbTrim(){                  // 古い録音から消す
  const db=await idb();
  const tx=db.transaction('clips','readwrite'); const st=tx.objectStore('clips');
  const all=[]; 
  st.openCursor().onsuccess=(e)=>{
    const c=e.target.result;
    if(c){ all.push({k:c.value.k,at:c.value.at}); c.continue(); }
    else{ all.sort((a,b)=>a.at-b.at);
      const over=all.length-REC_KEEP;
      for(let i=0;i<over;i++) st.delete(all[i].k); }
  };
}
function keyOf(sent){ return sent.slice(0,80); }

async function startRec(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert('この環境では録音できません'); return; }
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];
    const mt = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
             : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRec = mt ? new MediaRecorder(recStream,{mimeType:mt}) : new MediaRecorder(recStream);
    mediaRec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
    mediaRec.onstop=async ()=>{
      const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/mp4'});
      if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
      if(blob.size>0 && cur){
        curKey=keyOf(cur.e);
        if(curBlobURL) URL.revokeObjectURL(curBlobURL);
        curBlobURL=URL.createObjectURL(blob);
        try{ await idbPut(curKey,blob,cur.e); idbTrim(); }catch(e){}
        recState='has';
      } else recState='idle';
      paintRec();
    };
    mediaRec.start();
    recState='rec'; paintRec();
    clearTimeout(recTimer);
    recTimer=setTimeout(()=>{ if(recState==='rec') stopRec(); },20000);   // 保険の自動停止
  }catch(e){ alert('マイクを使えませんでした。ブラウザの許可を確認してください。'); recState='idle'; paintRec(); }
}
function stopRec(){
  clearTimeout(recTimer);
  try{ if(mediaRec&&mediaRec.state!=='inactive') mediaRec.stop(); }catch(e){}
}
function playMine(){
  if(!curBlobURL) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const a=new Audio(curBlobURL); a.play().catch(()=>{});
}
function dlMine(){
  if(!curBlobURL||!cur) return;
  const a=document.createElement('a');
  a.href=curBlobURL;
  a.download='repeat-'+jstDay()+'-'+cur.e.slice(0,24).replace(/[^A-Za-z0-9]+/g,'_')+'.m4a';
  a.click();
}
let mineToken=0;
async function loadMine(){                 // 裏面を開いたとき、過去の録音があれば出す
  if(!cur) return;
  const k=keyOf(cur.e);
  const my=++mineToken;
  if(curKey===k && curBlobURL){ recState='has'; paintRec(); return; }
  const row=await idbGet(k);
  // 保存を待っている間に、いま録り終えた音声が入ってくることがある。
  // それを消さないよう、待ち明けにもう一度確かめる。
  if(my!==mineToken) return;
  if(curKey===k && curBlobURL){ recState='has'; paintRec(); return; }
  if(curBlobURL){ URL.revokeObjectURL(curBlobURL); curBlobURL=null; }
  if(row&&row.blob){ curKey=k; curBlobURL=URL.createObjectURL(row.blob); recState='has'; }
  else { curKey=null; recState='idle'; }
  paintRec();
}
function elsaCopy(){
  if(!cur) return;
  const t=cur.e;
  const done=()=>{ const b=document.getElementById('elsaBtn'); if(b){ b.textContent='✓ コピー済み'; setTimeout(()=>{ if(b) b.textContent='ELSA用にコピー'; },1600); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>prompt('コピーしてください',t)); }
  else prompt('コピーしてください',t);
}
function toggleAutoRec(){
  autoRec=!autoRec;
  localStorage.setItem('rd_autorec', autoRec?'1':'0');
  const b=document.getElementById('autorecBtn');
  if(b) b.textContent='自動録音: '+(autoRec?'ON':'OFF');
}
function paintRec(){
  const el=document.getElementById('recSlot'); if(!el) return;
  const rec = recState==='rec';
  el.innerHTML =
    '<div class="rec-row">'
    + '<button class="rbtn '+(rec?'':'me')+'" id="recBtn">'+(rec?'<span class="recdot"></span>停止':'● 録音')+'</button>'
    + '<button class="rbtn model" id="modelBtn">🔊 お手本</button>'
    + '<button class="rbtn me" id="mineBtn"'+(recState==='has'?'':' disabled')+'>▶ 自分</button>'
    + '<button class="rbtn" id="dlBtn"'+(recState==='has'?'':' disabled')+'>⬇</button>'
    + '<button class="rbtn elsa" id="elsaBtn">ELSA用にコピー</button>'
    + '</div>'
    + '<div class="rec-note">'+(recState==='has'
        ? '<b>お手本 → 自分</b>の順に聞いて、語尾・強勢・間の置き方を比べる'
        : '復唱を録音して聴き比べる。ELSAは<b>読み上げの発音</b>採点用')+'</div>';
  const b=document.getElementById('recBtn');
  if(b) b.onclick=()=> rec ? stopRec() : startRec();
  const m=document.getElementById('modelBtn'); if(m) m.onclick=()=>speak(cur.e);
  const mi=document.getElementById('mineBtn'); if(mi) mi.onclick=playMine;
  const d=document.getElementById('dlBtn'); if(d) d.onclick=dlMine;
  const el2=document.getElementById('elsaBtn'); if(el2) el2.onclick=elsaCopy;
}

function render(){
 const ab=document.getElementById('autorecBtn');
 if(ab) ab.textContent='自動録音: '+(autoRec?'ON':'OFF');
 const st=$("stage");
 if(!cur){st.innerHTML='<p class="instr">この条件で出題できる文がありません。<br>上のタブを変えてください。</p>';updStats();return;}
 const tierName={1:"短文",2:"中文",3:"長文"}[cur.t];
 const isReview=sched[cur.e]!==undefined;
 let h=`<div class="meta">${cnt+1}問目 ・ ${cur.w}語</div>
        <div class="tierbadge">${isReview?"再挑戦 ・ ":""}${tierName}</div>`;
 if(phase==="ready"){
   h+=`<button class="play${played?" done":""}" id="play">${played?"✓":"▶"}</button>
       <div class="instr">${played?"復唱してください":"タップで再生（1回のみ）"}</div>`;
   if(played)h+=`<div class="timer" id="tm">${left}</div><div class="timerlabel" id="tl">秒</div>
      <button class="sbtn" id="showBtn" style="margin-top:4px">答えを見る</button>`;
 }else{
   if(cur.g)h+=`<div class="jargon">専門語彙あり・難度が語彙側で上振れ</div>`;
   h+=`<div class="sentence">${cur.e}</div>
       <div class="sentence-ja">${cur.j}</div>
       <div class="srcword">${cur.r==="d"?"日常・職場":"from: "+cur.s}</div>
       <button class="sbtn" id="replay">🔊 もう一度聞く</button>
       <div class="judge">
         <button class="jbtn ng" id="ng">崩れた</button>
         <button class="jbtn ok" id="ok">言えた</button>
       </div>
       <div class="rec-slot" id="recSlot"></div>`;
 }
 st.innerHTML=h;
 if(phase==="ready"){
   $("play").onclick=()=>{if(played)return;
     played=true;startTimer();render();
     speak(cur.e, ()=>{ if(autoRec && phase==="ready" && recState!=='rec') setTimeout(startRec,300); });};
   const sb=$("showBtn"); if(sb)sb.onclick=()=>{stopTimer();phase="reveal";render();};
 }else{
   if(recState==='rec') stopRec();
   paintRec(); loadMine();
   $("replay").onclick=()=>speak(cur.e);
   $("ok").onclick=()=>judge(true);
   $("ng").onclick=()=>judge(false);
 }
 updStats();
}

function judge(good){
 const k=cur.e; seen.add(k); total++;
 if(good){
   okCnt++;
   if(sched[k]!==undefined){
     streak[k]=(streak[k]||0)+1;
     if(streak[k]>=CLEAR_AT){delete sched[k];delete streak[k];}
     else sched[k]=total+GAP_RETRY;
   }
 }else{
   streak[k]=0; sched[k]=total+GAP_FAIL;
 }
 cnt++; history.push(k); save(); next();
}
function next(){stopTimer();played=false;phase="ready";left=15;cur=pick();render();}

function updStats(){
 $("st1").textContent=cnt;
 $("st2").textContent=cnt?Math.round(okCnt/cnt*100)+"%":"—";
 $("st3").textContent=Object.keys(sched).length;
 const rn={d:"日常・職場",n:"ニュース",a:"両方"}[reg];
 $("sub").textContent=`${rn} ・ 出題プール ${pool().length}文`;
}

function renderSet(){
 const sp=$("speeds");if(!sp)return;sp.innerHTML="";

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

window.micCheck = async function(){
  const out = [];
  out.push('protocol: ' + location.protocol);
  out.push('isSecureContext: ' + window.isSecureContext);
  out.push('mediaDevices: ' + (navigator.mediaDevices ? 'あり' : 'なし'));
  if (!navigator.mediaDevices) { alert(out.join('\n')); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());
    out.push('getUserMedia: 成功（録音機能を実装できます）');
  } catch(e) { out.push('getUserMedia: 失敗 ' + e.name); }
  alert(out.join('\n'));
};
